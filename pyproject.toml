[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-talk-coach"
version = "0.1.0"
description = "Spoken German practice: a voice conversation partner with a help ladder, plus local transcription of self-talk videos"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Sumanth Reddy Settipalli"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: German",
    "Topic :: Education",
]
dependencies = [
    "faster-whisper>=1.0",
    "av<19",  # av 19 dropped open(metadata_errors=) which faster-whisper 1.2.1 passes
    "spacy>=3.7",
    "genanki>=0.13",
    "anthropic>=0.40",
    "typer>=0.12",
    "pydub>=0.25",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
    "pydantic>=2.6",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "openai>=1.40",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
]
spike = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "azure-cognitiveservices-speech>=1.38",
    "openai>=1.40",
]

[project.scripts]
stc = "self_talk_coach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
